[package]
name = "sintonize-desktop"
version = "0.1.0"
description = "Sintonize — Estação Central"
authors = ["Sintonize"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sintonize_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
local-ip-address = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
